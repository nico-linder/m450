# Block 08 – CI/CD pipeline for the recipe planner backend.
#
# Stages (as in the theory): build -> test -> deploy
#   build:  compile the backend with Maven
#   test:   run all unit/integration tests, generate the Surefire HTML report and the JaCoCo coverage report,
#           publish the test results in the GitHub UI and upload the reports as an artifact
#   deploy: publish the reports of the latest main build on GitHub Pages
#
# Trigger: every push / pull request that changes the backend or this workflow (and manually via "Run workflow").

name: Recipe Planner Backend CI

on:
  push:
    paths:
      - '08-ci-cd-pipeline/recipe-planner-backend/**'
      - '.github/workflows/recipe-planner-backend.yml'
  pull_request:
    paths:
      - '08-ci-cd-pipeline/recipe-planner-backend/**'
      - '.github/workflows/recipe-planner-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment to GitHub Pages at a time; a newer run cancels an older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_DIR: 08-ci-cd-pipeline/recipe-planner-backend
  MAVEN_CLI_OPTS: --batch-mode --no-transfer-progress

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pom.xml

      - name: Compile
        run: mvn $MAVEN_CLI_OPTS compile

  test:
    name: Test & Reports
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # publish the JUnit results as a check run
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pom.xml

      - name: Run tests and generate reports
        run: mvn $MAVEN_CLI_OPTS verify

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: ${{ env.BACKEND_DIR }}/target/surefire-reports/TEST-*.xml
          check_name: Unit test results
          include_passed: true
          detailed_summary: true

      - name: Add coverage to job summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            {
              echo "## Code coverage (JaCoCo)"
              echo ""
              echo "| Class | Instructions | Branches | Lines |"
              echo "| :--- | ---: | ---: | ---: |"
              awk -F',' 'function pct(missed, covered) { total = missed + covered; return total == 0 ? "-" : sprintf("%.0f %%", 100 * covered / total) }
                NR > 1 {
                  printf "| %s | %s | %s | %s |\n", $3, pct($4, $5), pct($6, $7), pct($8, $9)
                  im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9
                }
                END { printf "| **Total** | **%s** | **%s** | **%s** |\n", pct(im, ic), pct(bm, bc), pct(lm, lc) }' "$CSV"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble report site
        if: always()
        run: |
          SITE="$GITHUB_WORKSPACE/report-site"
          mkdir -p "$SITE"
          # target/site contains surefire-report.html (+ css/images) and the jacoco/ coverage report
          cp -r target/site/. "$SITE/" 2>/dev/null || true
          sed -e "s|@RUN_NUMBER@|${{ github.run_number }}|g" \
              -e "s|@COMMIT@|${GITHUB_SHA::7}|g" \
              -e "s|@BRANCH@|${{ github.ref_name }}|g" \
              -e "s|@DATE@|$(date -u '+%Y-%m-%d %H:%M UTC')|g" \
              -e "s|@RUN_URL@|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|g" \
              ci/report-index.html > "$SITE/index.html"

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-run-${{ github.run_number }}
          path: |
            report-site
            ${{ env.BACKEND_DIR }}/target/surefire-reports
          retention-days: 30

      - name: Upload report site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: report-site

  deploy:
    name: Deploy reports to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
