# Block 09 – automated checks for the code review pull requests.
#
# Runs the backend tests (Maven) and the frontend tests (Jest / React Testing Library) for every pull request
# and push that changes the recipe planner of block 09. The result is shown as a check directly in the pull request,
# so the reviewer can see if all tests pass before reviewing the code.

name: Code Review Checks (Block 09)

on:
  pull_request:
    paths:
      - '09-code-reviews/**'
      - '.github/workflows/code-reviews-ci.yml'
  push:
    branches: [main]
    paths:
      - '09-code-reviews/**'
      - '.github/workflows/code-reviews-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: 09-code-reviews/recipe-planner-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 09-code-reviews/recipe-planner-backend/pom.xml

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 09-code-reviews/recipe-planner-backend/target/surefire-reports/TEST-*.xml
          check_name: Backend test results
          include_passed: true
          detailed_summary: true

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 09-code-reviews/recipe-planner-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 09-code-reviews/recipe-planner-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: true
